services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env.docker
      # Optional local overrides (gitignored); values here win over .env.docker.
      - path: .env.docker.local
        required: false
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-rls-user.sql:/docker-entrypoint-initdb.d/init-rls-user.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
      # Optional local overrides (gitignored); values here win over .env.docker.
      - path: .env.docker.local
        required: false
    environment:
      DBHOST: host.docker.internal
      ALLOWED_HOSTS: localhost,127.0.0.1,backend,host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - ./docker/backend/entrypoint.sh:/entrypoint.sh:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: /bin/bash /entrypoint.sh

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
      # Optional local overrides (gitignored); values here win over .env.docker.
      - path: .env.docker.local
        required: false
    environment:
      DBHOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A crm worker --loglevel=info

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
      # Optional local overrides (gitignored); values here win over .env.docker.
      - path: .env.docker.local
        required: false
    environment:
      DBHOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A crm beat --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # frontend/Dockerfile is multi-stage and its LAST stage is the production
      # server. Without this, compose would build that instead and run a
      # prebuilt bundle against the source mount below, which never reloads.
      target: dev
    env_file:
      - .env.docker
      # Optional local overrides (gitignored); values here win over .env.docker.
      - path: .env.docker.local
        required: false
    environment:
      PUBLIC_DJANGO_API_URL: http://host.docker.internal:8000
      PUBLIC_DJANGO_API_BROWSER_URL: http://127.0.0.1:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"

volumes:
  postgres_data:
  frontend_node_modules:
